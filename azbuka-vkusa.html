<head>

body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}

.btn{background:var(--accent);color:#0F0A1A;border:none;padding:.8rem 2rem;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}

<body>
<div class="app">

</html>
